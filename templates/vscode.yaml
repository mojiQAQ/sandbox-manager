name: vscode
description: "预装 code-server (VS Code Web) 的开发环境，通过浏览器访问"
base_image: ubuntu:22.04
connect_type: url
connect_port: 8443
install_commands:
  - "apt-get update && apt-get install -y curl git sudo wget"
  - "curl -fsSL https://code-server.dev/install.sh | sh"
entrypoint:
  - "code-server"
  - "--bind-addr"
  - "0.0.0.0:8443"
  - "--auth"
  - "none"
env:
  PASSWORD: ""
ports:
  "8443": 8443
